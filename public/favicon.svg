<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ícone da Mesa de Cartas Virtual: feltro verde, um verso e uma carta de
       copas. As cores são as dos tokens de src/index.css (--felt-green,
       --felt-light, --felt-dark, --pc-back, --pc-back-deep, --pc-paper,
       --pc-red, --pc-edge); um arquivo de imagem não consegue ler CSS. -->
  <defs>
    <radialGradient id="felt" cx="50%" cy="40%" r="72%">
      <stop offset="0" stop-color="#31774e"/>
      <stop offset="0.65" stop-color="#1b5538"/>
      <stop offset="1" stop-color="#0f3a26"/>
    </radialGradient>
    <pattern id="back" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="#3141a5"/>
      <rect width="2.5" height="5" fill="#222a77"/>
    </pattern>
  </defs>
  <rect id="table" x="2" y="2" width="60" height="60" rx="14" fill="url(#felt)" stroke="#082117" stroke-width="2"/>
  <g transform="rotate(-15 32 34)">
    <rect x="14.5" y="15.5" width="25" height="35" rx="4" fill="#082117" opacity="0.5"/>
    <rect x="12" y="12" width="25" height="35" rx="4" fill="url(#back)" stroke="#13162a" stroke-width="2.4"/>
    <rect x="15.5" y="15.5" width="18" height="28" rx="2" fill="none" stroke="#f8f4e7" stroke-width="1.6" opacity="0.85"/>
  </g>
  <g transform="rotate(11 32 34)">
    <rect x="28.5" y="17.5" width="25" height="35" rx="4" fill="#082117" opacity="0.5"/>
    <rect x="26" y="14" width="25" height="35" rx="4" fill="#f8f4e7" stroke="#13162a" stroke-width="2.4"/>
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#e23128" transform="translate(38.5 31.5) scale(0.78) translate(-12 -12.2)"/>
  </g>
</svg>
