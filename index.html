<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover libera a área atrás do entalhe. O CSS compensa com safe-area-inset. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Cor de --felt-dark. src/lib/felt.ts troca conforme a cor da mesa. -->
  <meta name="theme-color" content="#082117" />
  <!-- iOS: o Safari não lê tudo do manifesto para apps na tela de início. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mesa de Cartas" />

  <meta name="author" content="Ruan Patrick de Souza" />
  <!-- Ícones próprios da página. Sem eles o navegador busca /favicon.ico na
       raiz do domínio e mostra o ícone do site principal. O Vite acrescenta o
       caminho base (/virtual-card-playground/) no build. -->
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>
